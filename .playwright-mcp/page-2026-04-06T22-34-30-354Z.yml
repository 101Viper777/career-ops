        - generic [ref=e21]: About Us 🚀
        - generic [ref=e23]: Immutable is the world’s fastest-growing game platform, built to power the next generation of games. We aim to drive the next evolution of gaming, combining performance, digital ownership and cutting-edge technology to help games grow and succeed. At the intersection of AI-driven analytics, high-performance growth tools, and seamless digital ownership, our technology helps studios attract, engage, and scale player communities across both Web2 and Web3.
        - generic [ref=e25]: Founded in 2018, Immutable is one of Australia’s fastest companies to reach unicorn status, raising more than AUD $400M+ with a valuation of AUD $3.5B. Today, more than 700 games are building on Immutable, and industry leaders like Ubisoft have chosen us as their partner for the future of gaming.
        - generic [ref=e27]: "Over 6 million players use Immutable Passport, our unified identity enabling frictionless cross-game experiences, and our Immutable Audience platform has become the fastest-growing SaaS product line in our history. We're scaling rapidly, backed by a global team of creators, engineers, and gamers united by one mission: to build the most valuable growth layer in gaming and redefine how games launch, scale, and succeed. 🚀"
        - generic [ref=e29]: "About The Role 🤔:"
        - generic [ref=e31]: Immutable is building the future of player onboarding, discovery, and engagement. Our mission is to help more games launch successfully using next-generation growth and automation tools.
        - generic [ref=e33]: As an Associate GTM Operations Engineer, you’ll sit at the intersection of Applied AI, Automation Engineering, Support Operations, and Commercial Strategy. You’ll help scale our automation-led support engine, streamline GTM workflows, and build tools that empower our Commercial, Growth, and BD teams.
        - generic [ref=e35]: This is a high-impact, hands-on role where you’ll diagnose issues, optimise processes, build automations, and work closely with Product and Engineering teams to improve our customer and internal user experience.
