          - listitem [ref=e42]: "Supercharge the Commercial Engine: Architect, optimize, and execute the critical processes, tools, and data workflows that form the backbone of our commercial team."
          - listitem [ref=e43]: "Scale Intelligent Support: Take ownership of our customer support function, driving initiatives that allow us to scale efficiently while maintaining a world-class user experience."
          - listitem [ref=e44]: "Accelerate GTM Strategy: You will play a pivotal role in the Go-to-Market strategy for Immutable Audience, designing and deploying automation initiatives that widen our reach and impact."
          - listitem [ref=e45]: "Unlock Insights Through Data: Conduct ad-hoc analysis and provide insights that inform GTM strategy, customer onboarding, and support efficiency."
